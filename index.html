<script>
// 주의: 구글이 이 안의 별표 주석 시작 모양(슬래시+별표)을 주석으로 읽어 뒤를 자름 → 글자 안에서는 \x2a, \/\/ 로 적는다
// 구글 웹앱 틀 안에서는 저장소가 막힐 수 있어 오류가 나도 멈추지 않게
const LS = { get(k){ try { return localStorage.getItem(k) || '' } catch(e){ return '' } }, set(k,v){ try { localStorage.setItem(k,v) } catch(e){} }, del(k){ try { localStorage.removeItem(k) } catch(e){} } };
let PW = LS.get('sr_pw'), ME = LS.get('sr_me');
let D = null, CUR = 'rec', FIL = '진행', NEWP = [], CONG = '전체', CONQ = '', CONO = -1;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 시트가 시각을 「2026-11-13 5:04」처럼 바꿔도 읽게
function TT(s){ const m = String(s || '').match(/(\d{4})-(\d{1,2})-(\d{1,2})\s+(\d{1,2}):(\d{2})/); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) : null; }
const p2 = n => String(n).padStart(2, '0');
function L(s){ const d = TT(s); return d ? `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}` : ''; }
function nowL(){ const d = new Date(); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`; }
// 예전 「종결」 기록도 「완료」로 보이게
function norm(d){ (d.rec || []).forEach(r => { if (r['상태'] === '종' + '결') r['상태'] = '완료'; }); return d; }
const telOf = s => String(s || '').replace(/[^0-9+]/g, '');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1600)}
const API = 'https://script.google.com/macros/s/AKfycbzy0KeI4pqpqpHw1bkyZqRV_NYLGzyb-Jt48OZwtBBW4PhRfdabp1wWDX8sGkwi5Rvk/exec';
async function run(fn, ...a){ const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args: a }) }); const j = await r.json(); if (!j.ok) throw new Error(j.error); return j.data; }

$('#me').value = ME;
if (PW) { $('#pw').value = PW; doLogin(true); }

async function doLogin(auto){
  const pw = $('#pw').value.trim(), me = $('#me').value.trim();
  if (!me && !auto) { $('#loginMsg').textContent = '이름을 적어 주세요'; return; }
  $('#loginMsg').textContent = '확인 중…';
  try {
    D = norm(await run('loadAll', pw));
    PW = pw; ME = me || ME; LS.set('sr_pw', PW); LS.set('sr_me', ME);
    $('#login').style.display = 'none'; $('#app').style.display = 'block';
    $('#title').textContent = '⛑️ ' + D.event + ' 안전상황실';
    $('#admTab').style.display = D.admin ? '' : 'none';
    if (/reg|%EB%93%B1%EB%A1%9D|등록/.test(location.hash)) { REGV = 'in'; tab('reg'); } else render();

  } catch (e) {
    LS.del('sr_pw');
    $('#loginMsg').textContent = auto ? '' : '❌ ' + (e.message || e);
  }
}
async function refresh(){ try { D = norm(await run('loadAll', PW)); if (CUR === 'reg' && REGV === 'in') { rHint(); regList(); return; } if (!$('#sheet').style.display || $('#sheet').style.display==='none') render(); } catch(e){} }

function tab(t){CUR=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('#fab').style.display=t==='rec'?'block':'none';$('#main').classList.toggle('wide',t==='board'||(t==='reg'&&REGV==='board'));render()}

function render(){
  const open = D.rec.filter(r=>r['상태']!=='완료').length;
  $('#sub').textContent = (ME?ME+' · ':'') + '진행 중 ' + open + '건 · ' + D.now + ' 기준';
  ({board:renderBoard,rec:renderRec,con:renderCon,duty:renderDuty,med:renderMed,adm:renderAdm,reg:renderReg})[CUR]();
}

// ── 관리 화면: 관리자 비밀번호로 들어온 사람만 탭이 보임
function cnt(list, key){ const m = {}; list.forEach(r => { const k = key(r) || '(빈칸)'; m[k] = (m[k] || 0) + 1; }); return m; }
function bars(title, m, order){
  const ks = order || Object.keys(m).sort((a, b) => m[b] - m[a]);
  const mx = Math.max(1, ...ks.map(k => m[k] || 0));
  return `<h3>${title}</h3>` + (ks.length ? ks.map(k => `<div class="bar"><span>${esc(k)}</span><i style="width:${Math.round((m[k] || 0) / mx * 55)}%"></i><em>${m[k] || 0}</em></div>`).join('') : '<p class="muted">없음</p>');
}
function renderAdm(){
  const R = D.rec, nowT = TT(D.now);
  const st = cnt(R, r => r['상태']), rk = cnt(R, r => r['위험도']);
  const over = R.filter(r => r['재확인시각'] && r['상태'] !== '완료' && (TT(r['재확인시각'])||9e15) <= nowT).length;
  const ev = ['11-18','11-19','11-20','11-21'];
  const day = cnt(R, r => (r['접수시각'] || '').slice(5, 10));
  const hr = cnt(R, r => (r['접수시각'] || '').slice(11, 13) + '시');
  let h = `<div class="stat"><div><b>${R.length}</b>전체</div><div><b>${st['접수'] || 0}</b>접수</div><div><b>${st['처리중'] || 0}</b>처리중</div>
    <div><b>${st['완료'] || 0}</b>완료</div><div><b style="color:#ff6b6b">${rk['고'] || 0}</b>고위험</div><div><b style="color:#ff6b6b">${over}</b>재확인 지남</div></div>
    <button class="btn full" onclick="dlXlsx()">📥 엑셀 받기 (탭 4개)</button><div class="bars">`;
  h += bars('위험도별', rk, ['고','중','저']);
  h += bars('날짜별 (행사 11. 18.~21.)', day, ev.concat(Object.keys(day).filter(k => !ev.includes(k)).sort()));
  h += bars('시간대별', hr, Object.keys(hr).sort());
  h += bars('분류별', cnt(R, r => r['분류']));
  h += bars('장소별', cnt(R, r => r['장소']));
  h += bars('기록자별', cnt(R, r => r['기록자']));
  $('#main').innerHTML = h + '</div>';
}
function loadXlsxLib(){ return window.XLSX ? Promise.resolve() : new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https:\/\/cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'; s.onload = ok; s.onerror = () => no(new Error('엑셀 도구를 못 불러왔어요')); document.head.appendChild(s); }); }
async function dlXlsx(){

// 상황판: 접수 · 처리중 · 완료 세 칸
function renderBoard(){

// 첨부 사진: 드라이브 사진을 공개로 풀지 않고, 비밀번호 확인 뒤 서버(getPhoto)가 보내 줌. 한 번 받은 건 기억
const PH = {}, PHW = {};
function phList(r){ return String(r && r['사진'] || '').split('\n').map(s=>s.trim()).filter(Boolean); }
function thumb(r){ const p = phList(r); if (!p.length) return '';
  return `<div class="rthumb" onclick="event.stopPropagation();viewPh('${esc(r['ID'])}',0)">\x3cimg class="ld" data-ph="${esc(p[0])}" alt="사진">${p.length>1?`<b>+${p.length-1}</b>`:''}</div>`; }
function getPh(u){ if (PH[u]) return Promise.resolve(PH[u]); if (!PHW[u]) PHW[u] = run('getPhoto', PW, u).then(d => (PH[u] = d)).catch(e => { delete PHW[u]; throw e; }); return PHW[u]; }
function fillPh(){ document.querySelectorAll('img[data-ph]').forEach(im => { const u = im.dataset.ph;
  if (PH[u]) { im.src = PH[u]; im.classList.remove('ld'); return; }
  getPh(u).then(d => { im.src = d; im.classList.remove('ld'); }).catch(() => { im.alt = '사진 못 불러옴'; }); }); }
let PVL = [], PVI = 0;
function viewPh(id, i){ const r = D.rec.find(x => x['ID'] === id); PVL = phList(r); PVI = i; showPv(); }
function showPv(){ let v = $('#pv'); if (!v) { v = document.createElement('div'); v.id = 'pv'; v.onclick = e => { if (e.target === v || e.target.tagName === 'IMG') v.style.display = 'none'; }; document.body.appendChild(v); }
  v.innerHTML = `\x3cimg class="ld" data-ph="${esc(PVL[PVI])}" alt="사진"><div class="pvbar">${PVL.length > 1 ? `<button onclick="PVI=(PVI+PVL.length-1)%PVL.length;showPv()">‹</button><span>${PVI+1} / ${PVL.length}</span><button onclick="PVI=(PVI+1)%PVL.length;showPv()">›</button>` : ''}<button onclick="$('#pv').style.display='none'">닫기</button></div>`;
  v.style.display = 'flex'; fillPh(); }

function callBtns(p){ const ns = String(p || '').split(/[,\/·]/).map(telOf).filter(Boolean); return ns.length ? `<div class="call">${ns.map(t => `<a class="btn gray" href="tel:${t}">📞 ${ns.length > 1 ? t : '전화'}</a>` + (/^01/.test(t) ? `<a class="btn gray" href="sms:${t}">💬 문자</a>` : '')).join('')}</div>` : ''; }

  // 검색칸에 쓰는 중이면(30초 새로고침) 목록만 다시 그려 글자·커서가 날아가지 않게

function nums(p){ return String(p || '').split(/[,\/·]/).map(telOf).filter(Boolean); }
function renderConList(){

    </div>`;
  });
  $('#clist').innerHTML = h + '</div>';
}

}

function shrink(file){ return new Promise(ok=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const m=1600, s=Math.min(1,m/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=im.width*s; c.height=im.height*s; c.getContext('2d').drawImage(im,0,0,c.width,c.height); ok({name:file.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',data:c.toDataURL('image/jpeg',0.82).split(',')[1]}); }; im.src=fr.result; }; fr.readAsDataURL(file); }); }
async function addPhotos(files){ for (const f of files) NEWP.push(await shrink(f)); const p=$('#pinfo'); if(p) p.innerHTML='사진 '+NEWP.length+'장 준비됨<div class="pgrid" style="margin-top:6px">'+NEWP.map(x=>'<div>\x3cimg src="data:image/jpeg;base64,'+x.data+'"></div>').join('')+'</div>'; }
const dt = v => v ? v.replace('T',' ') : '';

async function saveNew(){
  const r = { by:ME, risk:segVal('risk'), cat:$('#f_cat').value, place:$('#f_place').value.trim(), text:$('#f_text').value.trim(), action:$('#f_action').value.trim(), recheck:dt($('#f_re').value), photos:NEWP };
  if (!r.text) { toast('내용을 적어 주세요'); return; }
  $('#saveBtn').disabled = true; $('#saveBtn').textContent = '저장 중…';
  try { await run('addRec', PW, r); toast('✅ 기록됨'); D = norm(await run('loadAll', PW)); closeSheet(); }
  catch(e){ toast('❌ 저장 실패'); $('#saveBtn').disabled=false; $('#saveBtn').textContent='기록 남기기'; }
}

// 관리자 삭제: 실수 방지로 두 번 눌러야 지워짐. 지운 기록은 시트 「삭제기록」 탭에 남음
async function delRec(id){
  const b = $('#delBtn');
  if (!b.dataset.ok) { b.dataset.ok = '1'; b.textContent = '⚠️ 한 번 더 누르면 삭제돼요'; setTimeout(() => { if (b.isConnected) { b.dataset.ok = ''; b.textContent = '🗑 이 기록 삭제 (관리자)'; } }, 4000); return; }
  b.disabled = true; b.textContent = '지우는 중…';
  try { await run('delRec', PW, id, ME); toast('🗑 삭제됨'); D = norm(await run('loadAll', PW)); closeSheet(); }
  catch (e) { toast('❌ ' + (e.message || e)); b.disabled = false; b.dataset.ok = ''; b.textContent = '🗑 이 기록 삭제 (관리자)'; }
}
function openRec(id){
  const r = D.rec.find(x=>x['ID']===id); if (!r) return; NEWP = [];
  const photos = phList(r).map((u,i)=>`<div onclick="viewPh('${esc(r['ID'])}',${i})">\x3cimg class="ld" data-ph="${esc(u)}" alt="사진 ${i+1}"></div>`).join('');
  sheet(`<div class="row"><span class="chip">${esc(r['ID'])}</span><span class="muted">${esc(r['접수시각'])} · ${esc(r['기록자'])}</span></div>
    <label>상태</label>${seg('st',['접수','처리중','완료'],r['상태'])}
    <label>위험도</label>${seg('risk',['고','중','저'],r['위험도'])}
    <label>분류</label><select id="e_cat">${opts(D.cats,r['분류'])}</select>
    <label>장소</label><input id="e_place" value="${esc(r['장소'])}">
    <label>내용</label><textarea id="e_text">${esc(r['내용'])}</textarea>
    <label>조치</label><textarea id="e_action" style="min-height:60px">${esc(r['조치'])}</textarea>
    <label>후속조치</label><textarea id="e_follow" style="min-height:60px">${esc(r['후속조치'])}</textarea>
    <label>재확인 시각</label><input id="e_re" type="datetime-local" value="${esc(L(r['재확인시각']))}">
    <label>완료 시각</label><input id="e_done" type="datetime-local" value="${esc(L(r['완료시각']))}">
    <label>사진</label>${photos?`<div class="pgrid">${photos}</div>`:'<div class="muted">없음</div>'}\x3cinput type="file" accept="image/\x2a" multiple onchange="addPhotos(this.files)"><div class="muted" id="pinfo"></div>
    <p></p><button class="btn full" id="saveBtn" onclick="saveRec('${esc(r['ID'])}')">저장</button>
    <p></p><button class="btn gray full" onclick="closeSheet()">닫기</button>
    ${D.admin ? `<p></p><button class="btn danger full" id="delBtn" onclick="delRec('${esc(r['ID'])}')">🗑 이 기록 삭제 (관리자)</button>` : ''}
    <div class="log">${esc(r['처리이력'])}</div>`);
  fillPh();
}

async function saveRec(id){
  const u = { by:ME, '상태':segVal('st'), '위험도':segVal('risk'), '분류':$('#e_cat').value, '장소':$('#e_place').value.trim(), '내용':$('#e_text').value.trim(), '조치':$('#e_action').value.trim(), '후속조치':$('#e_follow').value.trim(), '재확인시각':dt($('#e_re').value), '완료시각':dt($('#e_done').value), photos:NEWP };
  if (u['상태']==='완료' && !u['완료시각']) u['완료시각'] = dt(nowL());
  if (u['상태']!=='완료') u['완료시각'] = '';
  $('#saveBtn').disabled = true; $('#saveBtn').textContent = '저장 중…';
  try { await run('updRec', PW, id, u); toast('✅ 저장됨'); D = norm(await run('loadAll', PW)); closeSheet(); }
  catch(e){ toast('❌ 저장 실패'); $('#saveBtn').disabled=false; $('#saveBtn').textContent='저장'; }
}
// ── 등록: 등록현황판(사전 숫자 대비 현장 입장) + 담당자 입장 수 입력
const RK = ['일반', '단체', '선수단'], RDAYS = ['2026-11-18', '2026-11-19', '2026-11-20', '2026-11-21'], RDN = { '2026-11-18': '18(수)', '2026-11-19': '19(목)', '2026-11-20': '20(금)', '2026-11-21': '21(토)' };
let REGV = LS.get('sr_regv') || 'board', REGD = '전체', RIK = LS.get('sr_rk') || '일반', RDEL = '';
function rToday(){ const t = String(D.now || '').slice(0, 10); return RDAYS.includes(t) ? t : RDAYS[0]; }
function rN(v){ return Number(v) || 0; }
function rSum(list){ return list.reduce((a, r) => a + rN(r['인원']), 0); }
function rv(v){ REGV = v; LS.set('sr_regv', v); $('#main').classList.toggle('wide', v === 'board'); render(); }
function renderReg(){
  if (!D.plan) { $('#main').innerHTML = '<div class="empty"><i>⏳</i>서버가 아직 옛 버전이에요</div>'; return; }
  $('#main').classList.toggle('wide', REGV === 'board');
  const sw = `<div class="rsw"><button class="${REGV==='board'?'on':''}" onclick="rv('board')">📈 등록현황판</button><button class="${REGV==='in'?'on':''}" onclick="rv('in')">✍️ 입장 수 넣기</button></div>`;
  $('#main').innerHTML = sw + (REGV === 'board' ? regBoard() : regIn());
  if (REGV === 'in') { rKind(RIK, true); regList(); }
}
function regBoard(){
  const f = r => REGD === '전체' || r['날짜'] === REGD;
  const reg = (D.reg || []).filter(f), plan = D.plan || [];
  const by = k => reg.filter(r => r['구분'] === k);
  let h = '<div class="filters">' + ['전체'].concat(RDAYS).map(d => `<button class="${REGD===d?'on':''}" onclick="REGD='${d}';render()">${d==='전체'?'전체 기간':RDN[d]}<b>${rSum((D.reg||[]).filter(r => d==='전체' || r['날짜']===d))}</b></button>`).join('') + '</div>';
  h += `<div class="rtot"><div class="t">🎫 ${REGD==='전체'?'전체 기간':RDN[REGD]} 현장 입장 (등록데스크 입력)</div><div class="big">${rSum(reg).toLocaleString()}<small>명</small></div>
    <div class="sub">${RK.map(k => `<span>${k} ${rSum(by(k)).toLocaleString()}</span>`).join('')}</div></div><div class="rgrid">`;
  RK.forEach(k => {
    const now = rSum(by(k)), pl = plan.filter(r => r['구분'] === k && (k === '일반' || f(r))), pre = rSum(pl);
    const ic = { 일반: '🙋', 단체: '🚌', 선수단: '🏆' }[k];
    let sub;
    if (k === '일반') sub = `<div class="vs">사전등록 ${pre.toLocaleString()}명 <span class="muted">(${esc((pl[0]||{})['비고']||'')})</span></div>`;
    else {
      const ok = pl.filter(p => reg.some(r => r['구분'] === k && r['이름'] === p['이름'])).length;
      const pc = pre ? Math.round(now / pre * 100) : 0;
      sub = `<div class="pbar"><i style="width:${Math.min(100, pc)}%"></i></div><div class="vs">신청 ${pre.toLocaleString()}명 중 ${pc}% · 도착 ${ok}/${pl.length}${k==='단체'?'곳':'개 대회'}</div>`;
    }
    h += `<div class="rcard"><h3>${ic} ${k === '일반' ? '일반 참관객' : k === '단체' ? '단체 참관객' : '경진대회 선수단'}<span>${by(k).length}번 입력</span></h3><div class="big">${now.toLocaleString()}<small>명 입장</small></div>${sub}</div>`;
  });
  h += '</div>';
  if (REGD === '전체') {
    const m = {}; RDAYS.forEach(d => m[RDN[d]] = rSum((D.reg||[]).filter(r => r['날짜'] === d)));
    h += '<div class="bars">' + bars('날짜별 현장 입장', m, RDAYS.map(d => RDN[d]));
  } else {
    const m = {}; reg.forEach(r => { const k = String(r['입력시각']).slice(11, 13) + '시'; m[k] = (m[k] || 0) + rN(r['인원']); });
    h += '<div class="bars">' + bars(RDN[REGD] + ' 시간대별 입장 (입력 시각 기준)', m, Object.keys(m).sort());
  }
  h += '</div>';
  ['단체', '선수단'].forEach(k => {
    const pl = plan.filter(r => r['구분'] === k && f(r)).slice().sort((a, b) => (a['날짜'] || '9').localeCompare(b['날짜'] || '9') || String(a['비고']).localeCompare(String(b['비고'])));
    const names = pl.map(p => p['이름']);
    const extra = {}; reg.filter(r => r['구분'] === k && !names.includes(r['이름'])).forEach(r => extra[r['이름']] = (extra[r['이름']] || 0) + rN(r['인원']));
    if (!pl.length && !Object.keys(extra).length) return;
    h += `<div class="clist" style="margin-top:12px"><div class="lhead">${k === '단체' ? '🚌 단체별' : '🏆 경진대회별'}<span>✅ 도착 · 입장 / 신청</span></div>`;
    pl.forEach(p => {
      const n = rSum(reg.filter(r => r['구분'] === k && r['이름'] === p['이름']));
      h += `<div class="crow ${n ? 'ok' : ''}" style="cursor:default"><div class="cinfo"><div class="cname">${n ? '✅ ' : ''}${esc(p['이름'])}</div><div class="crole">${p['날짜'] ? RDN[p['날짜']] || esc(p['날짜']) : '날짜 미정'} · ${esc(p['비고'])}</div></div><div class="gnum"><b>${n}</b>/ ${rN(p['인원'])}명</div></div>`;
    });
    Object.keys(extra).forEach(nm => h += `<div class="crow ok" style="cursor:default"><div class="cinfo"><div class="cname">✅ ${esc(nm)}</div><div class="crole">신청 명단에 없음 (현장 입력)</div></div><div class="gnum"><b>${extra[nm]}</b>명</div></div>`);
    h += '</div>';
  });
  return h;
}
function regIn(){
  const d0 = rToday();
  return `<div class="card">
    <label style="margin-top:0">구분</label><div class="seg" id="rkind">${RK.map(k => `<button type="button" class="${k===RIK?'on':''}" onclick="rKind('${k}')">${k}</button>`).join('')}</div>
    <label>날짜</label><select id="rday" onchange="rKind(RIK, true)">${RDAYS.map(d => `<option value="${d}" ${d===d0?'selected':''}>${RDN[d]}</option>`).join('')}</select>
    <div id="rnameBox"></div>
    <label>입장 인원</label>
    <div class="cnt"><button type="button" onclick="rAdd(-1)">−</button><input id="rn" type="number" inputmode="numeric" min="1" placeholder="0"><button type="button" onclick="rAdd(1)">＋</button></div>
    <div class="qadd"><button type="button" onclick="rAdd(5)">+5</button><button type="button" onclick="rAdd(10)">+10</button><button type="button" onclick="rAdd(50)">+50</button><button type="button" onclick="$('#rn').value=''">지우기</button></div>
    <label>메모 (선택)</label><input id="rnote" placeholder="예: 인솔교사 2명 포함">
    <p></p><button class="btn full" id="rsave" onclick="saveReg()">입장 ${'수'} 저장</button>
    <p class="muted" style="margin:8px 2px 0">입력자: ${esc(ME || '')} · 잘못 넣었으면 관리자에게 말해 주세요</p>
  </div><div class="clist"><div class="lhead">최근 입력<span id="rlistDay"></span></div><div id="rlist"></div></div>`;
}
function rKind(k, keep){
  RIK = k; LS.set('sr_rk', k);
  document.querySelectorAll('#rkind button').forEach(b => b.classList.toggle('on', b.textContent === k));
  const box = $('#rnameBox'); if (!box) return;
  const prev = keep && $('#rname') ? $('#rname').value : '';
  if (k === '일반') { box.innerHTML = ''; regList(); return; }
  const day = $('#rday').value;
  const pl = (D.plan || []).filter(r => r['구분'] === k);
  const a = pl.filter(r => r['날짜'] === day), b = pl.filter(r => r['날짜'] !== day);
  const o = r => `<option value="${esc(r['이름'])}" ${r['이름']===prev?'selected':''}>${esc(r['이름'])} (${rN(r['인원'])}명${r['날짜'] && r['날짜'] !== day ? ' · ' + (RDN[r['날짜']] || r['날짜']) : ''})</option>`;
  box.innerHTML = `<label>${k === '단체' ? '단체(학교) 이름' : '경진대회'}</label><select id="rname" onchange="rHint()"><option value="">선택</option>`
    + (a.length ? `<optgroup label="${RDN[day]} 예정">${a.map(o).join('')}</optgroup>` : '')
    + (b.length ? `<optgroup label="다른 날 · 날짜 미정">${b.map(o).join('')}</optgroup>` : '')
    + `<option value="__etc">기타 (직접 입력)</option></select><input id="retc" style="display:none;margin-top:6px" placeholder="이름을 적어 주세요"><div id="rhint"></div>`;
  rHint(); regList();
}
function rName(){ const v = $('#rname') ? $('#rname').value : ''; return v === '__etc' ? ($('#retc').value || '').trim() : v; }
function rHint(){
  const s = $('#rname'); if (!s) return;
  $('#retc').style.display = s.value === '__etc' ? 'block' : 'none';
  const p = (D.plan || []).find(r => r['구분'] === RIK && r['이름'] === s.value);
  if (!p) { $('#rhint').innerHTML = ''; return; }
  const got = rSum((D.reg || []).filter(r => r['구분'] === RIK && r['이름'] === p['이름'])), left = rN(p['인원']) - got;
  $('#rhint').innerHTML = `<div class="ghint">신청 ${rN(p['인원'])}명 · 지금까지 입장 ${got}명${left > 0 ? ` · <a href="#" style="color:#7dd3fc;font-weight:800" onclick="$('#rn').value=${left};return false">남은 ${left}명 넣기</a>` : ''}<br><span class="muted">${esc(p['비고'])}</span></div>`;
}
function rAdd(n){ const i = $('#rn'); i.value = Math.max(0, rN(i.value) + n) || ''; }
function regList(){
  const el = $('#rlist'); if (!el) return;
  const day = $('#rday') ? $('#rday').value : rToday();
  $('#rlistDay').textContent = RDN[day] + ' · ' + rSum((D.reg || []).filter(r => r['날짜'] === day)) + '명';
  const L = (D.reg || []).filter(r => r['날짜'] === day).slice().reverse().slice(0, 40);
  el.innerHTML = L.length ? L.map(r => `<div class="rlog"><div class="cinfo"><div style="font-weight:800">${esc(r['구분'])}${r['이름'] ? ' · ' + esc(r['이름']) : ''}</div><div class="crole">${esc(String(r['입력시각']).slice(11))} · ${esc(r['입력자'])}${r['비고'] ? ' · ' + esc(r['비고']) : ''}</div></div><div class="n">${rN(r['인원'])}명</div>${D.admin ? `<button class="x" onclick="rDel('${esc(r['ID'])}', this)">${RDEL === r['ID'] ? '한 번 더' : '🗑'}</button>` : ''}</div>`).join('')
    : '<p class="muted" style="padding:12px 14px;margin:0">아직 없어요</p>';
}
async function saveReg(){
  const n = rN($('#rn').value), name = RIK === '일반' ? '' : rName();
  if (n < 1) { toast('인원을 넣어 주세요'); return; }
  if (RIK !== '일반' && !name) { toast('이름을 골라 주세요'); return; }
  const btn = $('#rsave'); btn.disabled = true; btn.textContent = '저장 중…';
  try {
    await run('addReg', PW, { kind: RIK, name, day: $('#rday').value, n, note: $('#rnote').value.trim(), by: ME });
    D = norm(await run('loadAll', PW));
    toast('✅ ' + (name || RIK) + ' ' + n + '명 저장');
    $('#rn').value = ''; $('#rnote').value = ''; rHint(); regList();
  } catch (e) { toast('❌ ' + (e.message || '저장 실패')); }
  btn.disabled = false; btn.textContent = '입장 수 저장';
}
async function rDel(id, b){
  if (RDEL !== id) { RDEL = id; regList(); return; }
  RDEL = ''; b.disabled = true;
  try { await run('delReg', PW, id, ME); D = norm(await run('loadAll', PW)); toast('🗑 지웠어요'); } catch (e) { toast('❌ ' + (e.message || '지우기 실패')); }
  rHint(); regList();
}
</script>
