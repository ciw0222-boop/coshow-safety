<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>제3회 CO-SHOW 안전상황실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#0a1020;--panel:#131c31;--panel2:#18233c;--line:#26344f;--text:#eef2f9;--mute:#a1aec6;--accent:#ff5a4e;--hi:#ff5a4e;--mid:#ffab2e;--lo:#34c98a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Pretendard,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;letter-spacing:-.01em}
header{position:sticky;top:0;z-index:5;background:rgba(10,16,32,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 14px 8px}
header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
header small{display:flex;align-items:center;gap:6px;margin-top:2px;color:var(--mute);font-size:13px}
header small::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--lo);box-shadow:0 0 0 3px rgba(52,201,138,.2)}
nav{display:flex;gap:4px;margin-top:10px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border:0;border-radius:12px;background:transparent;color:var(--mute);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
nav button i{font-style:normal;font-size:19px;line-height:1}
nav button.on{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(255,90,78,.35)}
main{padding:14px 14px 104px;max-width:720px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 14px 13px;margin-bottom:10px}
.card.rec{border-left:5px solid #3a4560;cursor:pointer}
.card.rec.k-고{border-left-color:var(--hi);background:linear-gradient(90deg,rgba(255,90,78,.09),var(--panel) 45%)}
.card.rec.k-중{border-left-color:var(--mid)}
.card.rec.k-저{border-left-color:var(--lo)}
.card.rec.done{opacity:.62}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#22304d;color:#d3dcee;white-space:nowrap}
.r-고{background:var(--hi);color:#fff}.r-중{background:var(--mid);color:#2a1a00}.r-저{background:var(--lo);color:#03200f}
.s-접수{background:#4c6ef5;color:#fff}.s-처리중{background:#ffd43b;color:#2a2000}.s-종결{background:#2c3650;color:#b3bfd4}
.place{margin-left:auto;color:var(--mute);font-size:13px;font-weight:600}
.muted{color:var(--mute);font-size:13px}
.txt{white-space:pre-wrap;margin:10px 0 8px;font-size:16.5px;font-weight:600;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mute);font-size:13px}
.who{font-size:17px;font-weight:800}
.role{color:var(--mute);font-size:13.5px;margin-top:2px;word-break:keep-all}
.tel{font-size:15px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums}
.mail{color:#8fb3ff;font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.info{color:var(--mute);font-size:13.5px;margin-top:3px}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #2e3e62;background:#0c1428;color:var(--text);font-size:16px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,90,78,.18)}
textarea{min-height:96px;line-height:1.5}
.btn{display:inline-block;padding:13px 14px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:800;font-size:15px;font-family:inherit;text-decoration:none;text-align:center;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6}
.btn.gray{background:var(--panel2);color:#e3e9f5;border:1px solid #2e3e62}
.btn.full{width:100%}
.btn.danger{background:transparent;color:#ff8f87;border:1px solid rgba(255,90,78,.45)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:11px 0;border-radius:12px;border:1px solid #2e3e62;background:#0c1428;color:#c9d4ea;font-size:15px;font-weight:600;font-family:inherit}
.seg button.on{border-color:var(--accent);background:rgba(255,90,78,.16);color:#fff;font-weight:800}
.fab{position:fixed;right:16px;bottom:20px;z-index:6;border-radius:99px;padding:15px 22px;font-size:16px;box-shadow:0 8px 24px rgba(255,90,78,.45)}
.filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.filters button{padding:8px 14px;border-radius:99px;border:1px solid #2e3e62;background:transparent;color:#c3cee3;font-size:14px;font-weight:600;font-family:inherit;white-space:nowrap}
.filters button b{margin-left:4px;color:var(--mute);font-weight:700}
.filters button.on{background:var(--text);border-color:var(--text);color:#0a1020}
.filters button.on b{color:#4a5670}
.call{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.call a{flex:1 1 40%;font-size:14.5px;padding:11px 8px}
.log{font-size:12.5px;color:var(--mute);white-space:pre-wrap;border-top:1px dashed #2e3e62;margin-top:14px;padding-top:10px;line-height:1.6}
.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.date{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:22px 2px 10px;color:#ffc9c4}
.date:first-child{margin-top:4px}
.date::after{content:'';flex:1;height:1px;background:var(--line)}
.date span{color:var(--mute);font-weight:600;font-size:12.5px}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
.empty i{display:block;font-style:normal;font-size:34px;margin-bottom:6px}
.sos{background:linear-gradient(135deg,#ff5a4e,#c42d27);border:0;color:#fff}
.sos .who{font-size:19px}
.sos .btn{background:#fff;color:#c42d27}
#login .logo{width:62px;height:62px;margin:0 auto 10px;border-radius:18px;background:linear-gradient(135deg,#ff5a4e,#c42d27);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 8px 24px rgba(255,90,78,.35)}
.sheet{position:fixed;inset:0;background:rgba(4,8,18,.72);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet .box{background:#0f182c;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px 26px;border-top:1px solid var(--line)}
.sheet .box::before{content:'';display:block;width:42px;height:5px;border-radius:9px;background:#33425f;margin:4px auto 12px}
.sheet h3{font-size:19px;font-weight:800}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:#0a1020;padding:11px 18px;border-radius:99px;font-weight:800;display:none;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.over{color:#ff8f87;font-weight:800}
.thumbs a{color:#8fb3ff;font-size:14px;margin-right:10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:12.5px;font-weight:600;color:var(--mute)}
.stat b{display:block;font-size:26px;font-weight:800;color:var(--text);line-height:1.2}
.bars{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 14px 12px;margin-top:12px}
.bars h3{font-size:14px;font-weight:800;margin:16px 0 8px;color:#ffc9c4}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bar span{width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:12px;background:linear-gradient(90deg,#ff5a4e,#ff8a5c);border-radius:6px;min-width:3px}
.bar em{font-style:normal;color:var(--mute);font-weight:700}
.cbar{display:flex;gap:8px;margin-bottom:12px}
.cbar select{flex:0 0 46%;font-weight:700}
.cbar input{flex:1;min-width:0}
.clist{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.lhead{display:flex;justify-content:space-between;padding:9px 14px;background:#0f182c;font-size:13px;font-weight:800;color:#ffc9c4;border-bottom:1px solid var(--line)}
.lhead span{color:var(--mute);font-weight:600}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.crow:last-child{border-bottom:0}
.crow.open{background:#17213a}
.cinfo{flex:1;min-width:0}
.cname{font-size:16px;font-weight:800}
.crole{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow.open .crole{white-space:normal}
.rb{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid #2e3e62;text-decoration:none;font-size:18px}
.rb.t{background:rgba(52,201,138,.16);border-color:rgba(52,201,138,.55)}
.cmore{flex-basis:100%;padding:2px 0 4px}
.cmore .tel{margin-top:0}
#login{min-height:100vh;padding:4vh 18px 34px;background:repeating-linear-gradient(0deg,rgba(90,150,255,.045) 0 1px,transparent 1px 30px),repeating-linear-gradient(90deg,rgba(90,150,255,.045) 0 1px,transparent 1px 30px),radial-gradient(circle at 50% 20%,rgba(50,110,255,.38),transparent 52%),radial-gradient(circle at 85% 95%,rgba(130,80,255,.2),transparent 45%),linear-gradient(180deg,#060a24,#0c1340 55%,#090e2c)}
#login .kv{max-width:380px;margin:0 auto;text-align:center}
#login .kv img{display:block;width:min(64vw,240px);margin:0 auto -4px;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 60%,transparent 100%)}
#login .box{max-width:380px;margin:0 auto;background:rgba(13,20,58,.72);border:1px solid rgba(110,150,255,.28);border-radius:20px;padding:22px 20px 18px;text-align:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#login h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
#login .kvdate{color:#bcd0ff;font-size:14px;font-weight:600;line-height:1.55;margin:6px 0 6px}
#login label{text-align:left;color:#aebde6}
#login input{background:rgba(5,9,32,.85);border-color:#34418a}
#login input:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.2)}
#login .btn{background:linear-gradient(135deg,#2f6bff,#16b8e0);box-shadow:0 6px 18px rgba(40,130,255,.32)}
#login .muted{color:#aebde6}
</style>
</head>

<script>window.onerror=function(m,s,l,c){var e=document.getElementById('loginMsg');if(e)e.textContent+=' / 오류: '+m+' ('+l+':'+c+')';};</script>
<script>
// 주의: 구글이 이 안의 별표 주석 시작 모양(슬래시+별표)을 주석으로 읽어 뒤를 자름 → 글자 안에서는 \x2a, \/\/ 로 적는다
// 구글 웹앱 틀 안에서는 저장소가 막힐 수 있어 오류가 나도 멈추지 않게
const LS = { get(k){ try { return localStorage.getItem(k) || '' } catch(e){ return '' } }, set(k,v){ try { localStorage.setItem(k,v) } catch(e){} }, del(k){ try { localStorage.removeItem(k) } catch(e){} } };
let PW = LS.get('sr_pw'), ME = LS.get('sr_me');
let D = null, CUR = 'rec', FIL = '진행', NEWP = [], CONG = '전체', CONQ = '', CONO = -1;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const telOf = s => String(s || '').replace(/[^0-9+]/g, '');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1600)}
const API = 'https://script.google.com/macros/s/AKfycbzy0KeI4pqpqpHw1bkyZqRV_NYLGzyb-Jt48OZwtBBW4PhRfdabp1wWDX8sGkwi5Rvk/exec';
async function run(fn, ...a){ const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args: a }) }); const j = await r.json(); if (!j.ok) throw new Error(j.error); return j.data; }

$('#me').value = ME;
if (PW) { $('#pw').value = PW; doLogin(true); }

async function doLogin(auto){
  const pw = $('#pw').value.trim(), me = $('#me').value.trim();
  if (!me && !auto) { $('#loginMsg').textContent = '이름을 적어 주세요'; return; }
  $('#loginMsg').textContent = '확인 중…';
  try {
    D = await run('loadAll', pw);
    PW = pw; ME = me || ME; LS.set('sr_pw', PW); LS.set('sr_me', ME);
    $('#login').style.display = 'none'; $('#app').style.display = 'block';
    $('#title').textContent = '⛑️ ' + D.event + ' 안전상황실';
    $('#admTab').style.display = D.admin ? '' : 'none';
    render(); setInterval(refresh, 30000);
  } catch (e) {
    LS.del('sr_pw');
    $('#loginMsg').textContent = auto ? '' : '❌ ' + (e.message || e);
  }
}
async function refresh(){ try { D = await run('loadAll', PW); if (!$('#sheet').style.display || $('#sheet').style.display==='none') render(); } catch(e){} }

function tab(t){CUR=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('#fab').style.display=t==='rec'?'block':'none';render()}

function render(){
  const open = D.rec.filter(r=>r['상태']!=='종결').length;
  $('#sub').textContent = (ME?ME+' · ':'') + '진행 중 ' + open + '건 · ' + D.now + ' 기준';
  ({rec:renderRec,con:renderCon,duty:renderDuty,med:renderMed,adm:renderAdm})[CUR]();
}

// ── 관리 화면: 관리자 비밀번호로 들어온 사람만 탭이 보임
function cnt(list, key){ const m = {}; list.forEach(r => { const k = key(r) || '(빈칸)'; m[k] = (m[k] || 0) + 1; }); return m; }
function bars(title, m, order){
  const ks = order || Object.keys(m).sort((a, b) => m[b] - m[a]);
  const mx = Math.max(1, ...ks.map(k => m[k] || 0));
  return `<h3>${title}</h3>` + (ks.length ? ks.map(k => `<div class="bar"><span>${esc(k)}</span><i style="width:${Math.round((m[k] || 0) / mx * 55)}%"></i><em>${m[k] || 0}</em></div>`).join('') : '<p class="muted">없음</p>');
}
function renderAdm(){
  const R = D.rec, nowT = new Date(D.now.replace(' ','T')+':00');
  const st = cnt(R, r => r['상태']), rk = cnt(R, r => r['위험도']);
  const over = R.filter(r => r['재확인시각'] && r['상태'] !== '종결' && new Date(r['재확인시각'].replace(' ','T')+':00') <= nowT).length;
  const ev = ['11-18','11-19','11-20','11-21'];
  const day = cnt(R, r => (r['접수시각'] || '').slice(5, 10));
  const hr = cnt(R, r => (r['접수시각'] || '').slice(11, 13) + '시');
  let h = `<div class="stat"><div><b>${R.length}</b>전체</div><div><b>${st['접수'] || 0}</b>접수</div><div><b>${st['처리중'] || 0}</b>처리중</div>
    <div><b>${st['종결'] || 0}</b>종결</div><div><b style="color:#ff6b6b">${rk['고'] || 0}</b>고위험</div><div><b style="color:#ffb020">${over}</b>재확인 지남</div></div>
    <button class="btn full" onclick="dlXlsx()">📥 엑셀 받기 (탭 4개)</button><div class="bars">`;
  h += bars('위험도별', rk, ['고','중','저']);
  h += bars('날짜별 (행사 11. 18.~21.)', day, ev.concat(Object.keys(day).filter(k => !ev.includes(k)).sort()));
  h += bars('시간대별', hr, Object.keys(hr).sort());
  h += bars('분류별', cnt(R, r => r['분류']));
  h += bars('장소별', cnt(R, r => r['장소']));
  h += bars('기록자별', cnt(R, r => r['기록자']));
  $('#main').innerHTML = h + '</div>';
}
function loadXlsxLib(){ return window.XLSX ? Promise.resolve() : new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https:\/\/cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'; s.onload = ok; s.onerror = () => no(new Error('엑셀 도구를 못 불러왔어요')); document.head.appendChild(s); }); }
async function dlXlsx(){
  try {
    toast('엑셀 만드는 중…'); await loadXlsxLib();
    const H = { 상황기록: ['ID','접수시각','기록자','장소','분류','위험도','상태','내용','조치','후속조치','재확인시각','사진','수정시각','처리이력'],
      연락망: ['구분','이름','역할','전화','비고'], 근무표: ['날짜','시작','끝','위치','이름','역할','전화'], 의료: ['구분','이름','주소','전화','운영','거리','출처'] };
    const src = { 상황기록: D.rec.slice().reverse(), 연락망: D.con, 근무표: D.duty, 의료: D.med };
    const wide = ['내용','조치','후속조치','처리이력','주소','운영','출처','사진'];
    const wb = XLSX.utils.book_new();
    Object.keys(H).forEach(n => {
      const ws = XLSX.utils.aoa_to_sheet([H[n]].concat(src[n].map(r => H[n].map(k => r[k] || ''))));
      ws['!cols'] = H[n].map(k => ({ wch: wide.includes(k) ? 40 : 14 }));
      XLSX.utils.book_append_sheet(wb, ws, n);
    });
    XLSX.writeFile(wb, 'CO-SHOW_안전상황실_' + D.now.replace(/[-: ]/g, '') + '.xlsx');
    toast('✅ 엑셀 받았어요');
  } catch (e) { toast('❌ ' + (e.message || e)); }
}

function renderRec(){
  const f = {진행:r=>r['상태']!=='종결', 고위험:r=>r['위험도']==='고', 종결:r=>r['상태']==='종결', 전체:()=>true}[FIL];
  const list = D.rec.filter(f);
  const fs = {진행:r=>r['상태']!=='종결', 고위험:r=>r['위험도']==='고', 종결:r=>r['상태']==='종결', 전체:()=>true};
  let h = '<div class="filters">' + Object.keys(fs).map(k=>`<button class="${k===FIL?'on':''}" onclick="FIL='${k}';render()">${k}<b>${D.rec.filter(fs[k]).length}</b></button>`).join('') + '</div>';
  if (!list.length) h += '<div class="empty"><i>✅</i>기록이 없어요</div>';
  const nowT = new Date(D.now.replace(' ','T')+':00');
  list.forEach(r=>{
    const re = r['재확인시각']; const over = re && r['상태']!=='종결' && new Date(re.replace(' ','T')+':00') <= nowT;
    h += `<div class="card rec k-${esc(r['위험도'])} ${r['상태']==='종결'?'done':''}" onclick="openRec('${esc(r['ID'])}')">
      <div class="row"><span class="chip r-${esc(r['위험도'])}">${esc(r['위험도'])}위험</span><span class="chip s-${esc(r['상태'])}">${esc(r['상태'])}</span>${r['분류']?`<span class="chip">${esc(r['분류'])}</span>`:''}${r['장소']?`<span class="place">📍 ${esc(r['장소'])}</span>`:''}</div>
      <div class="txt">${esc(r['내용'])}</div>
      <div class="meta"><span>🕒 ${esc(r['접수시각'])}</span><span>✍️ ${esc(r['기록자'])}</span>${re?`<span class="${over?'over':''}">⏰ 재확인 ${esc(re)}${over?' 지남':''}</span>`:''}${r['사진']?'<span>📷 사진</span>':''}</div>
    </div>`;
  });
  $('#main').innerHTML = h;
}

// 번호가 여러 개면(쉼표·빗금) 나눠서 버튼을 따로, 문자 버튼은 휴대폰(01…)에만
function callBtns(p){ const ns = String(p || '').split(/[,\/·]/).map(telOf).filter(Boolean); return ns.length ? `<div class="call">${ns.map(t => `<a class="btn gray" href="tel:${t}">📞 ${ns.length > 1 ? t : '전화'}</a>` + (/^01/.test(t) ? `<a class="btn gray" href="sms:${t}">💬 문자</a>` : '')).join('')}</div>` : ''; }

function renderCon(){
  if (!D.con.length) { $('#main').innerHTML = '<div class="empty"><i>📞</i>연락망이 비어 있어요<br>구글 시트 「연락망」 탭에 적으면 여기에 떠요</div>'; return; }
  // 검색칸에 쓰는 중이면(30초 새로고침) 목록만 다시 그려 글자·커서가 날아가지 않게
  if ($('#cq') && document.activeElement === $('#cq')) return renderConList();
  const n = cnt(D.con, c => c['구분']);
  $('#main').innerHTML = `<div class="cbar"><select id="cg" onchange="CONG=this.value;CONO=-1;renderConList()">`
    + [['전체', D.con.length]].concat(Object.keys(n).map(k => [k, n[k]])).map(([k, v]) => `<option value="${esc(k)}" ${k===CONG?'selected':''}>${esc(k.replace('컨소시엄 ','').replace(' 담당자',''))} (${v})</option>`).join('')
    + `</select><input id="cq" type="search" placeholder="🔍 이름·소속 찾기" value="${esc(CONQ)}" oninput="CONQ=this.value;CONO=-1;renderConList()"></div><div id="clist"></div>`;
  renderConList();
}
function nums(p){ return String(p || '').split(/[,\/·]/).map(telOf).filter(Boolean); }
function renderConList(){
  const q = CONQ.trim().toLowerCase().replace(/\s+/g, '');
  const list = D.con.map((c, i) => [c, i]).filter(([c]) => (CONG === '전체' || c['구분'] === CONG)
    && (!q || [c['이름'], c['역할'], c['비고'], c['구분'], c['전화'], telOf(c['전화'])].join(' ').toLowerCase().replace(/\s+/g, '').includes(q)));
  if (!list.length) { $('#clist').innerHTML = '<div class="empty"><i>🔍</i>찾는 사람이 없어요</div>'; return; }
  let h = '', g = null;
  const n = cnt(list.map(x => x[0]), c => c['구분']);
  list.forEach(([c, i]) => {
    if (c['구분'] !== g) { if (g !== null) h += '</div>'; g = c['구분']; h += `<div class="clist"><div class="lhead">${esc(g || '기타')}<span>${n[g || '(빈칸)']}명</span></div>`; }
    const ns = nums(c['전화']), m = ns.find(t => /^01/.test(t)), t1 = m || ns[0], open = i === CONO;
    const mail = /@/.test(c['비고']);
    h += `<div class="crow ${open?'open':''}" onclick="CONO=(CONO===${i}?-1:${i});renderConList()">
      <div class="cinfo"><div class="cname">${esc(c['이름'])}</div><div class="crole">${esc(c['역할'])}</div></div>
      ${m ? `<a class="rb" href="sms:${m}" onclick="event.stopPropagation()">💬</a>` : ''}${t1 ? `<a class="rb t" href="tel:${t1}" onclick="event.stopPropagation()">📞</a>` : ''}
      ${open ? `<div class="cmore">${c['전화'] ? `<div class="tel">${esc(c['전화'])}</div>` : '<div class="info">번호 없음</div>'}${c['비고'] ? `<div class="${mail?'mail':'info'}">${mail?'✉️ ':''}${esc(c['비고'])}</div>` : ''}${ns.length > 1 ? `<div onclick="event.stopPropagation()">${callBtns(c['전화'])}</div>` : ''}</div>` : ''}
    </div>`;
  });
  $('#clist').innerHTML = h + '</div>';
}

function renderDuty(){
  if (!D.duty.length) { $('#main').innerHTML = '<div class="empty"><i>🕒</i>근무표가 비어 있어요<br>구글 시트 「근무표」 탭에 적으면 여기에 떠요</div>'; return; }
  const [today, nowHM] = D.now.split(' ');
  let h = '', g = '';
  D.duty.forEach(d=>{ if (d['날짜']!==g){ g=d['날짜']; h+=`<div class="date">${esc(g)}</div>`; }
    const on = d['날짜']===today && d['시작']<=nowHM && nowHM<d['끝'];
    h += `<div class="card ${on?'now':''}"><div class="row"><b>${esc(d['시작'])}~${esc(d['끝'])}</b><span class="chip">${esc(d['위치'])}</span>${on?'<span class="chip r-고">지금 근무</span>':''}</div><div class="who" style="margin-top:8px">${esc(d['이름'])}</div><div class="role">${esc(d['역할'])}</div>${callBtns(d['전화'])}</div>`; });
  $('#main').innerHTML = h;
}

function renderMed(){
  let h = '<div class="card sos"><div class="who">🚨 응급 상황은 바로 119</div><div class="call"><a class="btn" href="tel:119">📞 119 전화</a></div></div>';
  if (!D.med.length) h += '<div class="empty"><i>🏥</i>의료 목록이 비어 있어요</div>';
  let g = '';
  D.med.forEach(m=>{ if (m['구분']!==g){ g=m['구분']; h+=`<div class="date">${esc(g)}</div>`; }
    h += `<div class="card"><div class="row"><span class="who">${esc(m['이름'])}</span>${m['거리']?`<span class="chip">${esc(m['거리'])}</span>`:''}</div>${m['주소']?`<div class="info">📍 ${esc(m['주소'])}</div>`:''}${m['운영']?`<div class="info">🕘 ${esc(m['운영'])}</div>`:''}
      <div class="call">${telOf(m['전화'])?`<a class="btn gray" href="tel:${telOf(m['전화'])}">📞 ${esc(m['전화'])}</a>`:''}<a class="btn gray" href="https:\/\/map.kakao.com/?q=${encodeURIComponent(m['주소']||m['이름'])}">🗺 지도</a></div></div>`; });
  $('#main').innerHTML = h;
}

function seg(name, opts, val){ return `<div class="seg" data-n="${name}">` + opts.map(o=>`<button type="button" class="${o===val?'on':''}" onclick="pick(this)">${o}</button>`).join('') + '</div>'; }
function pick(b){ b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }
function segVal(n){ const b = document.querySelector(`.seg[data-n="${n}"] button.on`); return b ? b.textContent : ''; }
function opts(list, val){ return '<option value="">선택</option>' + list.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join(''); }
function sheet(html){ $('#sheetBox').innerHTML = html; $('#sheet').style.display='flex'; }
function closeSheet(){ $('#sheet').style.display='none'; NEWP=[]; render(); }
$('#sheet').addEventListener('click', e=>{ if (e.target.id==='sheet') closeSheet(); });

function openNew(){
  NEWP = [];
  sheet(`<h3 style="margin:2px 0 4px">🚨 새 상황 기록</h3>
    <label>위험도</label>${seg('risk',['고','중','저'],'저')}
    <label>분류</label><select id="f_cat">${opts(D.cats,'')}</select>
    <label>장소</label><input id="f_place" list="plist" placeholder="예: 전시홀 B 입구"><datalist id="plist">${D.places.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
    <label>무슨 일인가요</label><textarea id="f_text" placeholder="누가 · 어디서 · 어떤 상황"></textarea>
    <label>바로 한 조치 (선택)</label><textarea id="f_action" style="min-height:60px"></textarea>
    <label>재확인 시각 (선택)</label><input id="f_re" type="datetime-local">
    <label>사진 (선택)</label>\x3cinput type="file" accept="image/\x2a" multiple onchange="addPhotos(this.files)"><div class="muted" id="pinfo"></div>
    <p></p><button class="btn full" id="saveBtn" onclick="saveNew()">기록 남기기</button>
    <p></p><button class="btn gray full" onclick="closeSheet()">닫기</button>`);
}

function shrink(file){ return new Promise(ok=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const m=1600, s=Math.min(1,m/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=im.width*s; c.height=im.height*s; c.getContext('2d').drawImage(im,0,0,c.width,c.height); ok({name:file.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',data:c.toDataURL('image/jpeg',0.82).split(',')[1]}); }; im.src=fr.result; }; fr.readAsDataURL(file); }); }
async function addPhotos(files){ for (const f of files) NEWP.push(await shrink(f)); const p=$('#pinfo'); if(p) p.textContent='사진 '+NEWP.length+'장 준비됨'; }
const dt = v => v ? v.replace('T',' ') : '';

async function saveNew(){
  const r = { by:ME, risk:segVal('risk'), cat:$('#f_cat').value, place:$('#f_place').value.trim(), text:$('#f_text').value.trim(), action:$('#f_action').value.trim(), recheck:dt($('#f_re').value), photos:NEWP };
  if (!r.text) { toast('내용을 적어 주세요'); return; }
  $('#saveBtn').disabled = true; $('#saveBtn').textContent = '저장 중…';
  try { await run('addRec', PW, r); toast('✅ 기록됨'); D = await run('loadAll', PW); closeSheet(); }
  catch(e){ toast('❌ 저장 실패'); $('#saveBtn').disabled=false; $('#saveBtn').textContent='기록 남기기'; }
}

// 관리자 삭제: 실수 방지로 두 번 눌러야 지워짐. 지운 기록은 시트 「삭제기록」 탭에 남음
async function delRec(id){
  const b = $('#delBtn');
  if (!b.dataset.ok) { b.dataset.ok = '1'; b.textContent = '⚠️ 한 번 더 누르면 삭제돼요'; setTimeout(() => { if (b.isConnected) { b.dataset.ok = ''; b.textContent = '🗑 이 기록 삭제 (관리자)'; } }, 4000); return; }
  b.disabled = true; b.textContent = '지우는 중…';
  try { await run('delRec', PW, id, ME); toast('🗑 삭제됨'); D = await run('loadAll', PW); closeSheet(); }
  catch (e) { toast('❌ ' + (e.message || e)); b.disabled = false; b.dataset.ok = ''; b.textContent = '🗑 이 기록 삭제 (관리자)'; }
}
function openRec(id){
  const r = D.rec.find(x=>x['ID']===id); if (!r) return; NEWP = [];
  const photos = (r['사진']||'').split('\n').filter(Boolean).map((u,i)=>`<a href="${esc(u)}" target="_blank">📷 사진 ${i+1}</a>`).join('');
  sheet(`<div class="row"><span class="chip">${esc(r['ID'])}</span><span class="muted">${esc(r['접수시각'])} · ${esc(r['기록자'])}</span></div>
    <label>상태</label>${seg('st',['접수','처리중','종결'],r['상태'])}
    <label>위험도</label>${seg('risk',['고','중','저'],r['위험도'])}
    <label>분류</label><select id="e_cat">${opts(D.cats,r['분류'])}</select>
    <label>장소</label><input id="e_place" value="${esc(r['장소'])}">
    <label>내용</label><textarea id="e_text">${esc(r['내용'])}</textarea>
    <label>조치</label><textarea id="e_action" style="min-height:60px">${esc(r['조치'])}</textarea>
    <label>후속조치</label><textarea id="e_follow" style="min-height:60px">${esc(r['후속조치'])}</textarea>
    <label>재확인 시각</label><input id="e_re" type="datetime-local" value="${esc((r['재확인시각']||'').replace(' ','T'))}">
    <label>사진</label><div class="thumbs">${photos||'<span class="muted">없음</span>'}</div>\x3cinput type="file" accept="image/\x2a" multiple onchange="addPhotos(this.files)"><div class="muted" id="pinfo"></div>
    <p></p><button class="btn full" id="saveBtn" onclick="saveRec('${esc(r['ID'])}')">저장</button>
    <p></p><button class="btn gray full" onclick="closeSheet()">닫기</button>
    ${D.admin ? `<p></p><button class="btn danger full" id="delBtn" onclick="delRec('${esc(r['ID'])}')">🗑 이 기록 삭제 (관리자)</button>` : ''}
    <div class="log">${esc(r['처리이력'])}</div>`);
}

async function saveRec(id){
  const u = { by:ME, '상태':segVal('st'), '위험도':segVal('risk'), '분류':$('#e_cat').value, '장소':$('#e_place').value.trim(), '내용':$('#e_text').value.trim(), '조치':$('#e_action').value.trim(), '후속조치':$('#e_follow').value.trim(), '재확인시각':dt($('#e_re').value), photos:NEWP };
  $('#saveBtn').disabled = true; $('#saveBtn').textContent = '저장 중…';
  try { await run('updRec', PW, id, u); toast('✅ 저장됨'); D = await run('loadAll', PW); closeSheet(); }
  catch(e){ toast('❌ 저장 실패'); $('#saveBtn').disabled=false; $('#saveBtn').textContent='저장'; }
}
</script>
